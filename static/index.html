<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>movieMaker Cloud</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 -apple-system, Segoe UI, Roboto, sans-serif; background: #14161c; color: #e6e8ee; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: #1b1e27; border-bottom: 1px solid #2a2e3a; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header select { background: #22252f; color: #e6e8ee; border: 1px solid #333747; border-radius: 6px; padding: 5px 8px; font-size: 13px; }
  header button { background: #22252f; color: #e6e8ee; border: 1px solid #333747; border-radius: 6px; padding: 5px 10px; font-size: 13px; cursor: pointer; }
  header .spacer { flex: 1; }
  header .status { font-size: 12px; color: #8b90a0; }
  .layout { display: flex; height: calc(100vh - 45px); }
  .planecol { flex: 1 1 42%; display: flex; flex-direction: column; border-right: 1px solid #2a2e3a; min-width: 0; padding: 20px 22px; overflow-y: auto; }
  .rail { flex: 1 1 58%; overflow-y: auto; padding: 14px; }
  .planecol h2 { margin: 0 0 8px; font-size: 18px; }
  .planecol p { color: #b7bccb; margin: 0 0 12px; max-width: 42em; }
  .planecol code, .kv code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: #1b1e27; padding: 1px 6px; border-radius: 4px; color: #c9d1ff; }
  .kv { background: #1b1e27; border: 1px solid #2a2e3a; border-radius: 10px; padding: 12px 14px; margin: 14px 0; font-size: 13px; }
  .kv div { margin: 4px 0; color: #8b90a0; }
  .kv strong { color: #e6e8ee; font-weight: 600; }
  .steps { margin: 0; padding-left: 18px; color: #b7bccb; }
  .steps li { margin: 6px 0; }
  .card { background: #1b1e27; border: 1px solid #2a2e3a; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #8b90a0; margin: 0 0 8px; }
  .card textarea, .card input[type=text] { width: 100%; background: #14161c; color: #e6e8ee; border: 1px solid #333747; border-radius: 6px; padding: 7px 9px; font: inherit; margin-bottom: 6px; }
  .card textarea { resize: vertical; min-height: 38px; }
  .pill { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; background: #2a2e3a; color: #b7bccb; margin-left: 6px; }
  .pill.approved { background: #1f5c3a; color: #b7ffd6; }
  .pill.review { background: #5c4c1f; color: #ffe9b7; }
  .pill.draft { background: #333747; }
  .entity { padding: 7px 8px; border-radius: 6px; background: #14161c; margin-bottom: 6px; font-size: 13px; }
  .entity .name { font-weight: 600; }
  .entity .desc, .entity .meta { color: #8b90a0; font-size: 12px; }
  .entity-row { display: flex; gap: 9px; align-items: flex-start; }
  .entity-info { min-width: 0; flex: 1; }
  .thumb { width: 56px; height: 56px; border-radius: 6px; object-fit: cover; background: #0d0e12; flex: 0 0 auto; display: block; }
  .thumb.placeholder { display: flex; align-items: center; justify-content: center; font-size: 9px; line-height: 1.2; color: #5a5f70; text-align: center; padding: 3px; }
  .empty { color: #8b90a0; font-style: italic; }
  a { color: #7a9cff; }
  .takes { margin-top: 6px; display: flex; flex-direction: column; gap: 6px; }
  .take { background: #0d0e12; border-radius: 6px; padding: 6px; }
  .take video { width: 100%; border-radius: 4px; display: block; }
  .take .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 11px; color: #8b90a0; }
  .take button { font-size: 11px; padding: 3px 8px; border-radius: 5px; border: 1px solid #333747; background: #22252f; color: #e6e8ee; cursor: pointer; }
  .take button.approve { background: #1f5c3a; border-color: #1f5c3a; color: #b7ffd6; }
  .cardhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cardhead h2 { margin: 0; }
  .cardhead button { font-size: 11px; padding: 4px 9px; border-radius: 6px; border: none; background: #3d6fd1; color: white; cursor: pointer; }
  .cardhead button:disabled { opacity: .5; cursor: default; }
  .stitchinfo { font-size: 12px; color: #8b90a0; margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1>movieMaker Cloud</h1>
  <select id="epPick"></select>
  <button id="epNew" title="New episode">+ new</button>
  <div class="spacer"></div>
  <span class="status" id="status"></span>
</header>
<div class="layout">
  <div class="planecol" id="planecol"></div>
  <div class="rail" id="rail"></div>
</div>

<script>
const $ = id => document.getElementById(id);
let episodes = [];
let activeEpisodeId = null;
let storyboard = null;
let config = null;
let jobsByScene = {};

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error((await r.json().catch(()=>({detail:r.statusText}))).detail || r.statusText);
  return r.status === 204 ? null : r.json();
}

async function loadEpisodes() {
  episodes = await api('/api/episodes');
  $('epPick').innerHTML = episodes.map(e => `<option value="${e.id}" ${e.is_active ? 'selected' : ''}>${escapeHtml(e.title)}</option>`).join('');
  const active = episodes.find(e => e.is_active) || episodes[0];
  if (active) { activeEpisodeId = active.id; await loadEpisodeState(); }
  else { activeEpisodeId = null; storyboard = null; renderRail(); renderPlane(); }
}

async function loadEpisodeState() {
  if (!activeEpisodeId) return;
  storyboard = await api(`/api/storyboard?episode_id=${activeEpisodeId}`);
  const videoJobs = await api(`/api/jobs?episode_id=${activeEpisodeId}&type=video&limit=200`);
  jobsByScene = {};
  for (const j of videoJobs) (jobsByScene[j.scene_id] ||= []).push(j);
  renderRail();
  renderPlane();
}

function renderPlane() {
  const cfg = config || {};
  const ep = storyboard && storyboard.episode;
  $('planecol').innerHTML = `
    <h2>Plan in Cursor</h2>
    <p>Chat and storyboard planning happen with the Cursor agent in this repo.
       This page is the live storyboard + media viewer. Video renders through
       OpenRouter <strong>MiniMax H3</strong>.</p>
    <div class="kv">
      <div><strong>Active episode</strong> ${ep ? escapeHtml(ep.title) + ' · <code>' + ep.id + '</code>' : '<span class="empty">none yet</span>'}</div>
      <div><strong>Video model</strong> <code>${escapeHtml(cfg.default_video_model || 'minimax/hailuo-3')}</code></div>
      <div><strong>Scene defaults</strong> ${cfg.default_scene_duration || 5}s · ${escapeHtml(cfg.default_scene_resolution || '2K')} · ${escapeHtml(cfg.default_scene_aspect_ratio || '16:9')}</div>
      <div><strong>API</strong> <code>/api/config</code> · <code>/api/storyboard</code> · <code>/api/scenes/{id}/generate</code></div>
    </div>
    <ol class="steps">
      <li>Paste lyrics in Cursor — one scene is made per sentence/line.</li>
      <li>The Director writes visual prompts (MiniMax H3, 2K) and quotes cost.</li>
      <li>You say yes → clips generate; they appear here. Approve, then stitch.</li>
    </ol>
  `;
}

function entityCard(e) {
  const img = e.reference_image_path
    ? `<a href="/media/${e.reference_image_path}" target="_blank"><img class="thumb" src="/media/${e.reference_image_path}?v=${(e.updated_at||'').slice(0,19)}"></a>`
    : `<div class="thumb placeholder">no image yet</div>`;
  return `
    <div class="entity">
      <div class="entity-row">
        ${img}
        <div class="entity-info">
          <div class="name">${escapeHtml(e.name)}</div>
          <div class="desc">${escapeHtml(e.description || '')}</div>
        </div>
      </div>
    </div>`;
}

function takeHtml(job, scene) {
  if (job.status !== 'completed' || !job.media_path) {
    return `<div class="take"><div class="row">${job.status}${job.error ? ' — ' + escapeHtml(job.error) : ''} · <code>${job.id}</code></div></div>`;
  }
  const approved = scene.approved_take_id === job.id;
  return `
    <div class="take">
      <video controls src="/media/${job.media_path}"></video>
      <div class="row">
        <code>${job.id}</code>
        ${approved ? '<span class="pill approved">approved</span>'
          : `<button class="approve" data-scene="${scene.id}" data-job="${job.id}">approve</button>`}
      </div>
    </div>`;
}

function sceneCard(s, i) {
  const takes = (jobsByScene[s.id] || []).map(j => takeHtml(j, s)).join('');
  const model = s.video_model ? ` · ${escapeHtml(s.video_model)}` : '';
  return `
    <div class="entity">
      <div class="name">${i+1}. ${escapeHtml(s.title)} <span class="pill ${s.status}">${s.status}</span></div>
      <div class="meta">${s.type} · ${s.duration}s · ${s.resolution}${s.chain ? ' · chained' : ''}${model}</div>
      ${s.prompt ? `<div class="desc">${escapeHtml(s.prompt)}</div>` : ''}
      ${takes ? `<div class="takes">${takes}</div>` : ''}
    </div>
  `;
}

function renderRail() {
  const rail = $('rail');
  if (!storyboard) {
    rail.innerHTML = '<div class="empty">Create an episode to see the storyboard.</div>';
    return;
  }
  const ep = storyboard.episode;
  const chars = storyboard.characters || [];
  const locs = storyboard.locations || [];
  const scenes = storyboard.scenes || [];
  rail.innerHTML = `
    <div class="card">
      <h2>Episode</h2>
      <div class="name" style="font-weight:600;margin-bottom:4px">${escapeHtml(ep.title)}</div>
      <div class="desc">${escapeHtml(ep.premise || '(no premise yet)')}</div>
      <div class="meta" style="margin-top:6px">${escapeHtml(ep.style || '')}</div>
    </div>
    <div class="card">
      <h2>Characters (${chars.length})</h2>
      ${chars.length ? chars.map(entityCard).join('') : '<div class="empty">none yet</div>'}
    </div>
    <div class="card">
      <h2>Locations (${locs.length})</h2>
      ${locs.length ? locs.map(entityCard).join('') : '<div class="empty">none yet</div>'}
    </div>
    <div class="card">
      <div class="cardhead">
        <h2>Scenes (${scenes.length})</h2>
        <button id="stitchBtn" ${scenes.some(s => s.approved_take_id) ? '' : 'disabled'}>Stitch episode</button>
      </div>
      ${scenes.length ? scenes.map(sceneCard).join('') : '<div class="empty">none yet</div>'}
      <div class="stitchinfo" id="stitchInfo"></div>
    </div>
  `;
  rail.querySelectorAll('button.approve').forEach(btn => {
    btn.onclick = async () => {
      await api(`/api/scenes/${btn.dataset.scene}/approve`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ job_id: btn.dataset.job }),
      });
      await loadEpisodeState();
    };
  });
  const stitch = $('stitchBtn');
  if (stitch) stitch.onclick = async () => {
    stitch.disabled = true;
    $('stitchInfo').textContent = 'stitching…';
    try {
      const res = await api(`/api/episodes/${activeEpisodeId}/stitch`, { method: 'POST' });
      $('stitchInfo').innerHTML = res.media_path
        ? `Done — <a href="/media/${res.media_path}" target="_blank">open episode</a>`
        : JSON.stringify(res);
    } catch (e) {
      $('stitchInfo').textContent = e.message;
    } finally {
      stitch.disabled = false;
    }
  };
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function createEpisode() {
  const title = prompt('Episode title:', 'Untitled episode');
  if (title === null) return;
  const ep = await api('/api/episodes', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ title }) });
  await loadEpisodes();
  activeEpisodeId = ep.id;
  await loadEpisodeState();
}

$('epNew').onclick = createEpisode;
$('epPick').onchange = async () => {
  activeEpisodeId = $('epPick').value;
  await api(`/api/episodes/${activeEpisodeId}/select`, { method: 'POST' });
  await loadEpisodeState();
};

setInterval(async () => {
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || !activeEpisodeId) return;
  try { await loadEpisodeState(); } catch (e) { /* ignore */ }
}, 6000);

(async () => {
  try { config = await api('/api/config'); } catch (e) { config = {}; }
  renderPlane();
  await loadEpisodes();
})();
</script>
</body>
</html>
